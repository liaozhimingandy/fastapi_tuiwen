name: Build Images

# =============================================================================
# 镜像构建与推送：Docker Hub + 阿里云 ACR，两个仓库各自独立判断「是否已配置凭据」
#
# 与 CI / Release 的分工：
#   CI            —— 只验证，绝不推送
#   Release       —— 只创建 GitHub Release（测试 + 说明）
#   Build Images  —— 只做镜像构建/推送（本文件），可单独重跑，不阻塞发布
#
# 触发与版本映射（版本号沿用 Django 发布模型，与 Git Tag 一一对应）：
#   push main                → dev（不附 sha，不占 latest）
#   push stable/A.B.x        → A.B 系列补丁构建（滚动 A.B / A 浮动标签）
#   push tag vA.B / vA.B.C   → 正式发布（附 sha + latest + 浮动 A.B / A）
#   push tag vA.Brc1 …       → 预发布（alpha/beta/rc，不占 latest）
#   workflow_dispatch        → 可覆盖版本号；可直接选平台/是否推送
#
# 凭据（配了哪个就推哪个；都没配或都登录失败则只本地构建、不报错）：
#   Docker Hub  : secrets.DOCKERHUB_USERNAME + secrets.DOCKERHUB_TOKEN
#                 兼容老命名 secrets.DOCKER_USERNAME + secrets.DOCKER_PASSWORD
#   阿里云 ACR  : secrets.ALIYUN_REGISTRY
#                 + vars.ALIYUN_NAMESPACE（ACR 命名空间，必填）
#                 + secrets.ALIYUN_USERNAME + secrets.ALIYUN_PASSWORD
#                 （缺失时回退 DOCKER_USERNAME / DOCKER_PASSWORD）
#
#   注意两点：
#     1) vars.ALIYUN_NAMESPACE 是你 ACR 账号里自建的命名空间，不能用 github
#        用户名猜 —— 猜出来的路径必然不存在，推送只会得到
#        "repository does not exist or may require authorization"；
#     2) 凭据是否可用由 meta 作业真实登录一次来判定（见 probe 步骤），
#        只看 secret 是否存在会让无效凭据一路带到 buildx push，最终只报 401。
# =============================================================================
on:
  push:
    branches: [main,  develop,'stable/**']
    tags: ['v*']
    # 分支推送只在代码/依赖/镜像定义变化时构建（tag 推送不受 path 过滤影响时更安全，
    # 但 GitHub 对 tags+paths 同样生效，因此发版流程务必改动 VERSION 文件）
    paths:
      - 'src/**'
      - 'main.py'
      - 'VERSION'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号（留空=dev；填 A.B 打稳定系列镜像）'
        required: false
        type: string
      push:
        description: '是否推送到镜像仓库'
        required: false
        type: boolean
        default: true
      platforms:
        description: '目标平台（多架构用逗号分隔，如 linux/amd64,linux/arm64）'
        required: false
        type: string
        default: 'linux/amd64'

# 本工作流不写仓库内容，也不推 GHCR；两个外部仓库用各自的 token 登录
permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_IMAGE_NAME: fastapi_tuiwen
  # 默认目标平台；多架构请用 workflow_dispatch 的 platforms 输入或改这里
  DEFAULT_PLATFORMS: linux/amd64
  # 是否滚动 A.B / A 浮动标签（让 :0.3 始终指向该系列最新）
  DEFAULT_FLOATING_TAGS: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # 1) 计算版本与标签（唯一决策点，后续作业只用 outputs）
  # ---------------------------------------------------------------------------
  meta:
    name: 计算版本与镜像标签
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 只传「不含 secret 值的标量」。
      # GitHub 会丢弃值里含 secret 的 job output（注解: Skip output 'x' since it
      # may contain secret），镜像名/标签必然含 ALIYUN_REGISTRY 等密钥值，
      # 因此镜像名与标签改由各作业用 ./.github/actions/resolve-image 现场计算。
      version: ${{ steps.calc.outputs.version }}
      short_sha: ${{ steps.calc.outputs.short_sha }}
      is_dev: ${{ steps.calc.outputs.is_dev }}
      is_latest: ${{ steps.calc.outputs.is_latest }}
      series: ${{ steps.calc.outputs.series }}
      floating: ${{ steps.calc.outputs.floating }}
      # 下面几项由 probe 步骤给出: 它用真实登录验证过凭据, 只有登录成功的仓库才会推送
      push_hub: ${{ steps.probe.outputs.push_hub }}
      push_aliyun: ${{ steps.probe.outputs.push_aliyun }}
      should_push: ${{ steps.probe.outputs.should_push }}
      platforms: ${{ steps.probe.outputs.platforms }}
      build_type: ${{ steps.probe.outputs.build_type }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 计算版本与构建类型
        id: calc
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH: ${{ inputs.push }}
          ENABLE_FLOATING_TAGS: ${{ vars.ENABLE_FLOATING_TAGS || env.DEFAULT_FLOATING_TAGS }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          # 版本号规范：vA.B / vA.B.C / vA.B(a|b|rc)N，预发布也接受 v1.0-rc1 写法
          SEMVER_RE='^v[0-9]+\.[0-9]+(\.[0-9]+)?(-?(a|b|rc)[0-9]+)?$'
          SERIES_RE='^stable/([0-9]+\.[0-9]+)(\.x)?$'

          VERSION=""
          WANT_PUSH="false"
          IS_DEV="false"
          IS_RELEASE="false"
          IS_PRERELEASE="false"
          SERIES=""
          LATEST="false"
          BUILD_TYPE="跳过"
          FLOATING="${ENABLE_FLOATING_TAGS:-true}"

          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            if ! [[ "${REF_NAME}" =~ ${SEMVER_RE} ]]; then
              echo "::error::Tag ${REF_NAME} 不符合规范（vA.B / vA.B.C / vA.Brc1）"
              exit 1
            fi
            VERSION="${REF_NAME#v}"
            WANT_PUSH="true"
            IS_RELEASE="true"
            BUILD_TYPE="正式发布"
            if [[ "${VERSION}" =~ (a|b|rc)[0-9]+$ ]]; then
              IS_PRERELEASE="true"
              BUILD_TYPE="预发布"
            else
              LATEST="true"
              SERIES=$(echo "${VERSION}" | cut -d. -f1,2)
            fi
          elif [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "branch" ]; then
            if [[ "${REF_NAME}" =~ ${SERIES_RE} ]]; then
              SERIES="${BASH_REMATCH[1]}"
              VERSION="${SERIES}"
              WANT_PUSH="true"
              BUILD_TYPE="稳定系列(${SERIES})"
            elif [ "${REF_NAME}" = "main" ]; then
              VERSION="dev"
              WANT_PUSH="true"
              IS_DEV="true"
              BUILD_TYPE="开发构建(main)"
            elif [ "${REF_NAME}" = "develop" ]; then
              # develop 单独打 develop 标签, 避免和 main 的 dev 相互覆盖
              VERSION="develop"
              WANT_PUSH="true"
              IS_DEV="true"
              BUILD_TYPE="开发构建(develop)"
            else
              BUILD_TYPE="未匹配分支, 不构建"
            fi
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION:-dev}"
            WANT_PUSH="${INPUT_PUSH:-true}"
            BUILD_TYPE="手动构建"
            [ "${VERSION}" = "dev" ] && IS_DEV="true"
            # 手动填 A.B 视为稳定系列构建（滚动 A.B / A，不占 latest）
            if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              SERIES="${VERSION}"
            elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              LATEST="true"
              SERIES=$(echo "${VERSION}" | cut -d. -f1,2)
            fi
          fi

          # 版本号必须已确定: 空版本会拼出 `<image>:` 这种非法标签,
          # docker 只会报 "invalid reference format", 看不出根因, 因此提前拦截
          if [ -z "${VERSION}" ]; then
            echo "::error title=版本号为空::引用 ${REF_TYPE}:${REF_NAME} 没有匹配到任何版本规则, 请检查 on.push.branches 与版本映射"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "is_dev=${IS_DEV}"
            echo "is_latest=${LATEST}"
            echo "series=${SERIES}"
            echo "floating=${FLOATING}"
            echo "needs_push=${WANT_PUSH}"
            echo "build_type=${BUILD_TYPE}"
            echo "platforms_requested=${{ inputs.platforms }}"
          } >> "$GITHUB_OUTPUT"

          # 版本号一致性检查：main.py 的版本来自 VERSION 文件，tag 与之不符会导致
          # 文档页显示的版本和镜像标签对不上
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          if [ "${IS_RELEASE}" = "true" ] && [ "${IS_PRERELEASE}" != "true" ] && [ "${FILE_VERSION}" != "${VERSION}" ]; then
            echo "::warning title=VERSION 与 Tag 不一致::VERSION=${FILE_VERSION}, Tag=${VERSION}"
          fi

      # 凭据是否可用必须靠真实登录验证，不能只看 secret 是否存在：
      #   1) DOCKER_USERNAME/DOCKER_PASSWORD 在老仓库里是 Docker Hub 凭据，
      #      但也有仓库拿它存阿里云凭据，仅凭名字无法判断归属；
      #   2) 登录失败的凭据若继续用于 buildx push，只会拿到 401 / 无法解释的报错。
      # 因此这里各登录一次，把「能不能推」变成 push_hub / push_aliyun 两个布尔值。
      - name: 探测推送凭据（真实登录一次）
        id: probe
        env:
          NEEDS_PUSH: ${{ steps.calc.outputs.needs_push }}
          VERSION_IN: ${{ steps.calc.outputs.version }}
          BUILD_TYPE_IN: ${{ steps.calc.outputs.build_type }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          ENV_DEFAULT_PLATFORMS: ${{ env.DEFAULT_PLATFORMS }}
          DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
          # Docker Hub: 新命名优先, 兼容老仓库的 DOCKER_USERNAME/DOCKER_PASSWORD
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          HUB_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
          # 阿里云 ACR: ALIYUN_* 优先, 同样兼容老命名
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          # 命名空间无论放在 Variables 还是 Secrets 都能读到
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}
          ALI_USER: ${{ secrets.ALIYUN_USERNAME || secrets.DOCKER_USERNAME }}
          ALI_PASS: ${{ secrets.ALIYUN_PASSWORD || secrets.DOCKER_PASSWORD }}
        run: |
          set -uo pipefail
          # 本地复跑时没有这个变量, set -u 会让步骤直接失败, 这里给个兜底
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

          # 镜像的命名空间必须是「能推的那个账号」：Docker Hub 用户名和 GitHub
          # 用户名经常不一致，拿 GitHub 用户名拼路径会推到别人的命名空间，
          # 报错是 push access denied ... repository does not exist or may require authorization
          HUB_NAMESPACE="${HUB_USER:-${GITHUB_REPOSITORY_OWNER}}"
          HUB_IMAGE="${DOCKER_REPOSITORY:-${HUB_NAMESPACE}/${DEFAULT_IMAGE_NAME}}"
          ALI_IMAGE=""
          PUSH_HUB="false"
          PUSH_ALI="false"
          BUILD_TYPE="${BUILD_TYPE_IN}"

          # docker login 成功 ≠ 能推：只读的 Access Token 也能登录，但换到的
          # registry token 只带 pull scope，buildx 最后只报一句
          #   insufficient_scope: authorization failed
          # 所以额外向 auth.docker.io 用 push scope 换一次 token，看有没有 push。
          # 返回 0=有 push, 1=只有 pull, 2=查不出来(不阻断, 继续尝试推送)
          hub_push_scope() {
            local ns="$1" repo="$2" user="$3" pass="$4" token payload
            token="$(curl -fsS -u "${user}:${pass}" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${ns}/${repo}:push,pull" 2>/dev/null \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')" || true
            [ -z "${token}" ] && return 2
            payload="$(printf '%s' "${token}" | cut -d. -f2 | tr '_-' '/+')"
            case $(( ${#payload} % 4 )) in
              2) payload="${payload}==" ;;
              3) payload="${payload}=" ;;
            esac
            payload="$(printf '%s' "${payload}" | base64 -d 2>/dev/null)" || return 2
            [ -z "${payload}" ] && return 2
            printf '%s' "${payload}" | grep -q '"push"' && return 0
            return 1
          }

          if [ "${NEEDS_PUSH}" = "true" ]; then
            # ---- Docker Hub ----
            if [ -n "${HUB_USER:-}" ] && [ -n "${HUB_PASS:-}" ]; then
              if printf '%s' "${HUB_PASS}" | docker login docker.io -u "${HUB_USER}" --password-stdin >/dev/null 2>&1; then
                hub_push_scope "${HUB_IMAGE%%/*}" "${HUB_IMAGE##*/}" "${HUB_USER}" "${HUB_PASS}"
                case $? in
                  0)
                    PUSH_HUB="true"
                    echo "::notice title=Docker Hub 可用::以 ${HUB_USER} 登录成功且 token 含 push 权限, 将推送 ${HUB_IMAGE}"
                    ;;
                  1)
                    echo "::warning title=Docker Hub 无写权限::登录成功, 但 Access Token 对 ${HUB_IMAGE} 只有 pull 权限; 请到 Docker Hub → Account Settings → Personal access tokens 生成 Read & Write 的 Token, 填到 DOCKERHUB_TOKEN 或 DOCKER_PASSWORD"
                    ;;
                  *)
                    PUSH_HUB="true"
                    echo "::notice title=Docker Hub 可用::以 ${HUB_USER} 登录成功(写权限未能预校验), 将推送 ${HUB_IMAGE}"
                    ;;
                esac
              else
                echo "::warning title=Docker Hub 凭据无效::以 ${HUB_USER} 登录 docker.io 失败, 本次不推 Docker Hub（检查 DOCKERHUB_TOKEN 或 DOCKER_PASSWORD 是否为 Access Token）"
              fi
              docker logout docker.io >/dev/null 2>&1 || true
            else
              echo "::notice title=跳过 Docker Hub::未配置 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN（或 DOCKER_USERNAME/DOCKER_PASSWORD）"
            fi

            # ---- 阿里云 ACR ----
            if [ -n "${ALIYUN_REGISTRY:-}" ] && [ -n "${ALI_USER:-}" ] && [ -n "${ALI_PASS:-}" ]; then
              if [ -z "${ALIYUN_NAMESPACE:-}" ]; then
                # ACR 的命名空间是账号里自建的, 不能用 github 用户名去猜 ——
                # 猜出来的路径一定不存在, 推送只会拿到 "repository does not exist"
                echo "::warning title=跳过阿里云 ACR::已配置 ALIYUN_REGISTRY 与凭据, 但缺少仓库变量 ALIYUN_NAMESPACE(ACR 命名空间), 无法确定镜像路径"
              elif printf '%s' "${ALI_PASS}" | docker login "${ALIYUN_REGISTRY}" -u "${ALI_USER}" --password-stdin >/dev/null 2>&1; then
                PUSH_ALI="true"
                ALI_IMAGE="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${HUB_IMAGE##*/}"
                echo "::notice title=阿里云 ACR 可用::以 ${ALI_USER} 登录 ${ALIYUN_REGISTRY} 成功, 将推送 ${ALI_IMAGE}"
              else
                echo "::warning title=阿里云 ACR 凭据无效::以 ${ALI_USER} 登录 ${ALIYUN_REGISTRY} 失败, 本次不推阿里云（检查用户名是否为 ACR 账号全名、密码是否为 ACR 固定密码）"
              fi
              docker logout "${ALIYUN_REGISTRY}" >/dev/null 2>&1 || true
            else
              echo "::notice title=跳过阿里云 ACR::未配置 ALIYUN_REGISTRY / ALIYUN_USERNAME / ALIYUN_PASSWORD"
            fi
          fi

          SHOULD_PUSH="false"
          if [ "${PUSH_HUB}" = "true" ] || [ "${PUSH_ALI}" = "true" ]; then
            SHOULD_PUSH="true"
          elif [ "${NEEDS_PUSH}" = "true" ]; then
            BUILD_TYPE="${BUILD_TYPE}（无可用凭据, 仅本地构建）"
            echo "::warning title=仅本地构建::没有任何仓库登录成功, 镜像只在 runner 上构建, 不会推送"
          fi

          PLATFORMS="${INPUT_PLATFORMS:-${ENV_DEFAULT_PLATFORMS:-linux/amd64}}"
          # 不推送时走 docker exporter load 到本地, 多平台镜像无法 load, 强制单平台
          if [ "${SHOULD_PUSH}" != "true" ]; then PLATFORMS="linux/amd64"; fi

          {
            echo "push_hub=${PUSH_HUB}"
            echo "push_aliyun=${PUSH_ALI}"
            echo "should_push=${SHOULD_PUSH}"
            echo "platforms=${PLATFORMS}"
            echo "build_type=${BUILD_TYPE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 镜像构建计划"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 事件 | \`${GITHUB_EVENT_NAME}\` |"
            echo "| 类型 | ${BUILD_TYPE} |"
            echo "| 版本 | \`${VERSION_IN}\` |"
            echo "| 平台 | \`${PLATFORMS}\` |"
            echo "| Docker Hub | \`${HUB_IMAGE}\` → ${PUSH_HUB} |"
            echo "| 阿里云 ACR | ${ALI_IMAGE:-未配置} → ${PUSH_ALI} |"
          } >> "${SUMMARY}"

  # ---------------------------------------------------------------------------
  # 2) 构建并推送（一次构建，产出同时打上 Docker Hub 与阿里云 ACR 的标签）
  # ---------------------------------------------------------------------------
  build:
    name: 构建并推送镜像
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 QEMU（多架构时需要）
        if: contains(needs.meta.outputs.platforms, 'arm')
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: needs.meta.outputs.push_hub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          # DOCKERHUB_* 为新命名; DOCKER_USERNAME/DOCKER_PASSWORD 兼容老仓库
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}

      - name: 登录阿里云 ACR
        if: needs.meta.outputs.push_aliyun == 'true'
        uses: docker/login-action@v3
        with:
          # ALIYUN_* 优先; 老仓库只有 DOCKER_USERNAME/DOCKER_PASSWORD 时回退使用
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD || secrets.DOCKER_PASSWORD }}

      # 镜像名与标签在本作业内现场计算: 不能靠 meta 的 job output,
      # 那类值含 secret(registry/用户名) 会被 GitHub 静默丢弃
      - name: 计算镜像名与标签
        id: img
        uses: ./.github/actions/resolve-image
        with:
          version: ${{ needs.meta.outputs.version }}
          short_sha: ${{ needs.meta.outputs.short_sha }}
          is_dev: ${{ needs.meta.outputs.is_dev }}
          is_latest: ${{ needs.meta.outputs.is_latest }}
          series: ${{ needs.meta.outputs.series }}
          floating: ${{ needs.meta.outputs.floating }}
          push_hub: ${{ needs.meta.outputs.push_hub }}
          push_aliyun: ${{ needs.meta.outputs.push_aliyun }}
          default_image_name: ${{ env.DEFAULT_IMAGE_NAME }}
          docker_repository: ${{ vars.DOCKER_REPOSITORY }}
          # 镜像名用「登录成功那个 Docker Hub 账号」当命名空间, 而不是 github 所有者
          hub_namespace: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          aliyun_registry: ${{ secrets.ALIYUN_REGISTRY }}
          # 命名空间放 Variables 或 Secrets 都能读到(很多人会建错地方)
          aliyun_namespace: ${{ vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}

      - name: 输出解析后的构建参数
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PLATFORMS: ${{ needs.meta.outputs.platforms }}
          SHOULD_PUSH: ${{ needs.meta.outputs.should_push }}
          PUSH_HUB: ${{ needs.meta.outputs.push_hub }}
          PUSH_ALI: ${{ needs.meta.outputs.push_aliyun }}
          HUB_IMAGE: ${{ steps.img.outputs.hub_image }}
          ALI_IMAGE: ${{ steps.img.outputs.aliyun_image }}
        run: |
          set -euo pipefail
          echo "::notice title=构建参数::version=${VERSION} should_push=${SHOULD_PUSH} hub=${PUSH_HUB} aliyun=${PUSH_ALI} platforms=${PLATFORMS}"
          echo "::notice title=镜像名::hub=${HUB_IMAGE} aliyun=${ALI_IMAGE:-无}"
          echo "本地标签文件:"; cat /tmp/tags.txt

      # 有凭据: 用 buildx 一次构建、多仓库多标签推送(支持多架构与 gha 缓存)
      - name: 记录构建开始时间
        if: needs.meta.outputs.should_push == 'true'
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: 构建并推送（buildx）
        if: needs.meta.outputs.should_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ needs.meta.outputs.platforms }}
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.title=fastapi_tuiwen
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=tuiwen-image
          cache-to: type=gha,scope=tuiwen-image,mode=max
          provenance: false
          sbom: false

      # 把耗时打到注解里: 作业日志需要 admin 权限才能读, 注解谁都能看。
      # 首次推送往往要 8-12 分钟 —— 依赖层没有缓存、还要把 mode=max 的缓存
      # 上传到 gha、同一批层分别传到两个仓库; 之后命中缓存通常 2-3 分钟。
      - name: 构建耗时
        if: needs.meta.outputs.should_push == 'true' && always()
        run: |
          if [ -n "${BUILD_START:-}" ]; then
            echo "::notice title=构建耗时::构建+推送共 $(( $(date +%s) - BUILD_START ))s（首次无缓存会明显更久）"
          fi

      # 没有凭据(或手动选择不推送): 只在本地产出镜像, 用经典构建器即可。
      # 不用 buildx 的 load 导出 —— 那条路径依赖 docker exporter,
      # 一旦导出配置不匹配就会在 1 秒内失败且错误只留在日志里。
      - name: 仅本地构建（不使用 buildx 导出）
        if: needs.meta.outputs.should_push != 'true'
        run: |
          set -euo pipefail
          first_tag="$(head -1 /tmp/tags.txt)"
          if [ -z "${first_tag}" ]; then
            echo "::error title=镜像标签为空::resolve-image 没有产出标签, 检查版本映射"
            exit 1
          fi
          echo "本地构建标签: ${first_tag}"
          docker build --file Dockerfile --tag "${first_tag}" .
          docker image inspect "${first_tag}" >/dev/null
          echo "本地镜像构建成功: ${first_tag}"

  # ---------------------------------------------------------------------------
  # 3) 推送后校验：镜像可拉取、平台正确、文件齐全（按实际推送的仓库分别校验）
  # ---------------------------------------------------------------------------
  verify:
    name: 推送后校验
    needs: [meta, build]
    if: needs.meta.outputs.should_push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 计算镜像名与标签
        id: img
        uses: ./.github/actions/resolve-image
        with:
          version: ${{ needs.meta.outputs.version }}
          short_sha: ${{ needs.meta.outputs.short_sha }}
          is_dev: ${{ needs.meta.outputs.is_dev }}
          is_latest: ${{ needs.meta.outputs.is_latest }}
          series: ${{ needs.meta.outputs.series }}
          floating: ${{ needs.meta.outputs.floating }}
          push_hub: ${{ needs.meta.outputs.push_hub }}
          push_aliyun: ${{ needs.meta.outputs.push_aliyun }}
          default_image_name: ${{ env.DEFAULT_IMAGE_NAME }}
          docker_repository: ${{ vars.DOCKER_REPOSITORY }}
          # 镜像名用「登录成功那个 Docker Hub 账号」当命名空间, 而不是 github 所有者
          hub_namespace: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          aliyun_registry: ${{ secrets.ALIYUN_REGISTRY }}
          # 命名空间放 Variables 或 Secrets 都能读到(很多人会建错地方)
          aliyun_namespace: ${{ vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: needs.meta.outputs.push_hub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          # DOCKERHUB_* 为新命名; DOCKER_USERNAME/DOCKER_PASSWORD 兼容老仓库
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}

      - name: 登录阿里云 ACR
        if: needs.meta.outputs.push_aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: 校验镜像可拉取
        env:
          HUB_IMAGE: ${{ steps.img.outputs.hub_image }}
          ALI_IMAGE: ${{ steps.img.outputs.aliyun_image }}
          VERSION: ${{ needs.meta.outputs.version }}
          IS_DEV: ${{ needs.meta.outputs.is_dev }}
          PUSH_HUB: ${{ needs.meta.outputs.push_hub }}
          PUSH_ALI: ${{ needs.meta.outputs.push_aliyun }}
          PLATFORMS: ${{ needs.meta.outputs.platforms }}
        run: |
          set -euo pipefail
          check() {
            local ref="$1"
            echo "--- 校验 ${ref}"
            docker buildx imagetools inspect "${ref}"
            # 单平台时才在本机拉起来检查文件；多架构交给部署侧验证
            if [ "${PLATFORMS}" = "linux/amd64" ]; then
              docker pull "${ref}"
              docker run --rm --entrypoint sh "${ref}" -c 'test -f /app/VERSION && test -d /app/src/tuiwen && test -f /app/main.py'
              got=$(docker run --rm --entrypoint cat "${ref}" /app/VERSION | tr -d '\r\n')
              echo "镜像内 VERSION: ${got}"
              # dev/develop 是分支构建, VERSION 文件本来就还是上一个发布版本,
              # 只有正式发布(tag)时才需要两者一致, 否则每次推 develop 都刷一条告警
              if [ "${IS_DEV}" != "true" ] && [ "${got}" != "${VERSION}" ]; then
                echo "::warning title=版本文件不一致::镜像内 VERSION=${got}, 标签=${VERSION}"
              fi
            fi
          }
          [ "${PUSH_HUB}" = "true" ] && check "${HUB_IMAGE}:${VERSION}"
          [ "${PUSH_ALI}" = "true" ] && check "${ALI_IMAGE}:${VERSION}"
          echo "镜像校验通过"

  # ---------------------------------------------------------------------------
  # 4) 汇总
  # ---------------------------------------------------------------------------
  report:
    name: 构建报告
    needs: [meta, build, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 计算镜像名（仅用于摘要展示）
        id: img
        if: needs.meta.outputs.version != ''
        uses: ./.github/actions/resolve-image
        with:
          version: ${{ needs.meta.outputs.version }}
          short_sha: ${{ needs.meta.outputs.short_sha }}
          is_dev: ${{ needs.meta.outputs.is_dev }}
          is_latest: ${{ needs.meta.outputs.is_latest }}
          series: ${{ needs.meta.outputs.series }}
          floating: ${{ needs.meta.outputs.floating }}
          push_hub: ${{ needs.meta.outputs.push_hub }}
          push_aliyun: ${{ needs.meta.outputs.push_aliyun }}
          default_image_name: ${{ env.DEFAULT_IMAGE_NAME }}
          docker_repository: ${{ vars.DOCKER_REPOSITORY }}
          # 镜像名用「登录成功那个 Docker Hub 账号」当命名空间, 而不是 github 所有者
          hub_namespace: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          aliyun_registry: ${{ secrets.ALIYUN_REGISTRY }}
          # 命名空间放 Variables 或 Secrets 都能读到(很多人会建错地方)
          aliyun_namespace: ${{ vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}

      - name: 写入摘要
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          HUB_IMAGE: ${{ steps.img.outputs.hub_image }}
          ALI_IMAGE: ${{ steps.img.outputs.aliyun_image }}
          PUSH_HUB: ${{ needs.meta.outputs.push_hub }}
          PUSH_ALI: ${{ needs.meta.outputs.push_aliyun }}
          BUILD_TYPE: ${{ needs.meta.outputs.build_type }}
          R_META: ${{ needs.meta.result }}
          R_BUILD: ${{ needs.build.result }}
          R_VERIFY: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          {
            echo "## 镜像构建报告"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 类型 | ${BUILD_TYPE} |"
            echo "| 版本 | \`${VERSION}\` |"
            [ "${PUSH_HUB}" = "true" ] && echo "| Docker Hub | \`${HUB_IMAGE}:${VERSION}\` |"
            [ "${PUSH_ALI}" = "true" ] && echo "| 阿里云 ACR | \`${ALI_IMAGE}:${VERSION}\` |"
            echo "| 已推送仓库 | hub=${PUSH_HUB} / aliyun=${PUSH_ALI} |"
            echo ""
            echo "| 阶段 | 结果 |"
            echo "| --- | --- |"
            echo "| 版本计算 | ${R_META} |"
            echo "| 构建推送 | ${R_BUILD} |"
            echo "| 推送后校验 | ${R_VERIFY} |"
            echo ""
            echo "> 部署建议固定 digest 或具体版本号，不要长期依赖 \`latest\`。"
          } >> "$GITHUB_STEP_SUMMARY"

          for entry in "版本计算:${R_META}" "构建推送:${R_BUILD}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error title=镜像构建失败::${name}(${result})"
              exit 1
            fi
          done
          echo "镜像流程结束"
