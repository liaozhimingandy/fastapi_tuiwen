[project]
name = "fastapi-tuiwen"
version = "0.1.0"
description = "FastAPI API for Tuiwen"
readme = "README.md"
requires-python = ">=3.14.2"

dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[all]>=0.141.1",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pyfiglet>=1.0.4",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "pytz>=2026.3.post1",
    "redis>=8.1.0",
    "setuptools>=83.0.0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.0",
]

# =============================================================================
# 测试配置
#   默认只收集 tests/ 下的离线用例(无外部依赖, 秒级跑完);
#   端到端用例在根目录 test_main.py, 需要 PostgreSQL / Redis / MailDev,
#   由 CI 的 integration 作业或本地 `pytest test_main.py` 显式指定。
# =============================================================================
[tool.pytest.ini_options]
# 仓库不是可安装的包(src/ 只是源码根), 用例里 `from src.tuiwen...` 依赖
# 仓库根目录在 sys.path 上; Windows 下用 `python -m pytest` 会隐式加上,
# 但 CI 里 `uv run pytest` 走的是 console script, 不会加 —— 所以显式声明。
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", ".git", "static", "logs", "__pycache__"]
addopts = "-ra"

# =============================================================================
# 静态检查(ruff)
#   只启用「一定是 bug」的规则: 未定义名称/语法错误, 不参与风格争论;
#   未使用变量与未使用导入对当前演进中的代码噪声太大, 先关掉。
# =============================================================================
[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".venv", "static", "logs", "__pycache__"]

[tool.ruff.lint]
select = ["F", "E9"]
ignore = ["F401", "F841"]
